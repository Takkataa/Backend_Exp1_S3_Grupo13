# Nombre de la aplicacion
spring.application.name=backendpetsalud

# --- Conexion a MySQL ---
# Todo se puede cambiar con variables de entorno (ver .env.example). Los valores despues de ":" son los de por defecto.
# Docker Compose define DB_HOST=db; al ejecutar sin Docker el host por defecto es localhost.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:petsalud_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:petsalud}
spring.datasource.password=${DB_PASSWORD:petsalud123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA ---
# ddl-auto=update: Hibernate crea/actualiza las tablas segun las entidades (usar solo en desarrollo)
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las consultas SQL generadas
spring.jpa.show-sql=true

# --- Seguridad JWT ---
# En produccion definir la variable de entorno JWT_SECRET (Base64, minimo 256 bits).
jwt.secret=${JWT_SECRET:/vCGU4IyPgWkItTKbOyeAWfiK5lnVeoAssPmSu5RNkvuD3n+DG7iJ2lmx41QYwxwHrLcE0PAg+IWoKyuRyBbNg==}
# Duracion del token: 1 hora (en milisegundos)
jwt.expiration-ms=3600000

# --- Administrador inicial ---
# Al arrancar, si el email no existe, se crea un usuario ADMIN con estos datos.
# Si ADMIN_PASSWORD esta vacio, no se crea ninguno.
app.admin.email=${ADMIN_EMAIL:admin@petsalud.cl}
app.admin.password=${ADMIN_PASSWORD:}
