# Configuración usada SOLO al ejecutar las pruebas (mvn test).
# Reemplaza a src/main/resources/application.properties, por eso repite todas las propiedades necesarias.
spring.application.name=backendpetsalud

# --- Base de datos en memoria H2 (modo compatible con MySQL) ---
# Se crea al iniciar las pruebas y desaparece al terminar: no hace falta tener MySQL ni Docker.
spring.datasource.url=jdbc:h2:mem:petsalud_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- JWT de pruebas (clave distinta a la de producción, solo válida aquí) ---
